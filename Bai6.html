<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 6 — Bảng danh sách món ăn</title>
    <link rel="stylesheet" href="stylebai6.css">
</head>
<body>
    <div class="container">
         <h2 class="title">Các món ngon Hà Nội</h2>
        <div class="content">
            <div class="cot-trai">
                <img src="Bat.gif" alt="Ảnh minh hoạ món ăn">
            </div> 
            <div class="cot-phai">
                <table>
                    <thead>
                        <tr>
                            <th class="cot-stt">STT</th>
                            <th class="cot-name">Tên món ăn</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td class="cot-stt">1</td>
                            <td>Bánh cuốn Thanh Trì</td>
                        </tr>
                        <tr>
                            <td class="cot-stt">2</td>
                            <td>Xôi Hà Nội</td>
                        </tr>
                        <tr>
                            <td class="cot-stt">3</td>
                            <td>Chả cá Lã Vọng</td>
                        </tr>
                        <tr>
                            <td class="cot-stt">4</td>
                            <td>Cháo Cóc</td>
                        </tr>
                        <tr>
                            <td class="cot-stt">5</td>
                            <td>Bánh Gai Ninh Giang</td>
                        </tr>
                        <tr>
                            <td class="cot-stt">6</td>
                            <td>Bún Thang Hà Nội</td>
                        </tr>
                        <tr>
                            <td class="cot-stt">7</td>
                            <td>Canh Lằng</td>
                        </tr>
                        <tr>
                            <td class="cot-stt">8</td>
                            <td>Vịt quay Lạng Sơn</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
